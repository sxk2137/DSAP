# Modified: machine-specific paths replaced with project-relative paths.
model:
  cldm:
    target: dsapd.model.conditioned_diffusion.ControlLDM
    params:
      latent_scale_factor: 0.18215
      unet_cfg:
        use_checkpoint: True
        image_size: 32 # unused
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_head_channels: 64 # need to fix for flash-attn
        use_spatial_transformer: True
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim: 1024
        legacy: False
      vae_cfg:
        embed_dim: 4
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
      clip_cfg:
        embed_dim: 1024
        vision_cfg:
          image_size: 224
          layers: 32
          width: 1280
          head_width: 80
          patch_size: 14
        text_cfg:
          context_length: 77
          vocab_size: 49408
          width: 1024
          heads: 16
          layers: 24
        layer: "penultimate"
      controlnet_cfg:
        use_checkpoint: True
        image_size: 32 # unused
        in_channels: 4
        hint_channels: 4
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_head_channels: 64 # need to fix for flash-attn
        use_spatial_transformer: True
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim: 1024
        legacy: False
        # Physics-aware prior branch:
        # [dark channel, bright channel, transmission, haze density, edge].
        # Set to 0 or remove this line for the original H2H baseline.
        prior_hint_channels: 5

  diffusion:
    target: dsapd.model.gaussian_diffusion.Diffusion
    params:
      linear_start: 0.00085
      linear_end: 0.0120
      timesteps: 1000

dataset:
  train:
    target: datasets.StaticPairedData
    params:
      # please fill in. These two folders contain corresponding hazy and clean image pairs. The current logic is that the hazy images are named name_index.png,
      # and the corresponding clean image is named name.jpg (since you may want to generate multiple hazy images for one clean image). But you can easily change this in datasets.py.
      hazy_folder: './outputs'
      clean_folder: './data/stage2_train/clean'
      crop_size: 512

train:
  # pretrained sd path
  sd_path: './weights/v2-1_512-ema-pruned.ckpt'
  # experiment directory path
  exp_dir: './experiment/stage2_prior_gate/'
  # 3e-5 for 50k steps, 1e-5 for 50k steps
  learning_rate: 1e-5
  batch_size: 1
  num_workers: 0
  train_steps: 100000
  
  log_every: 100
  ckpt_every: 10000
  image_every: 1000
  # Strongly recommended: resume from your trained original H2H stage2 checkpoint.
  # Example: 'weights/stage2.pt'
  resume: './experiment/stage2_prior_gate/checkpoints/0050000.pt'
